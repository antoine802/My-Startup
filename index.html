<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AboutTheWorld</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- BANNER -->
  <div class="banner">
    <div class="container">
      <h1> AboutTheWorld </h1>
      <h2>L'appli pour découvrir le monde entier et sa faune et sa flore grâce à nos reportage intégrale </h2>
      <a href=" https://www.nationalgeographic.fr/ //" class="btn-yellow" target="_blank">Découvrir l'appli</a>
    </div>
  </div>

  <!-- CONTENU PRINCIPAL -->
  <div class="container">

    <h2>Antoine Marchal</h2>
    <p class="subtitle">Reporter national de la faune et la flore</p>
    <img class="avatar" src="profil.jpg" alt="Antoine Marchal">

    <h2>Nos services</h2>
    <div class="cards">

      <div class="card">
        <img src="Reportages.jpg" alt="Reportage">
        <h3>Reportage</h3>
      </div>

      <div class="card">
        <img src="Photo de l'année.jpg" alt="Images de l'année ">
        <h3> Images de l'année </h3>
      </div>

      <div class="card">
        <img src="La faune et la flore.jpg" alt="La faune et la flore">
        <h3>La faune et la flore</h3>
      </div>

      <div class="card">
        <img src="Notre communauté.jpg" alt="Communauté">
        <h3>Communauté</h3>
      </div>

    </div>
  </div>

</body>
</html>
